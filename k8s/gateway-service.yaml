appName: gateway
port: 8080
image:
  repository: DOCKER_USER/gateway-service
env:
  JAVA_TOOL_OPTIONS: "-Xmx256m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xshare:auto"
  FLIGHT_SERVICE_URL: http://flight-service:8060
  TICKET_SERVICE_URL: http://ticket-service:8070
  BONUS_SERVICE_URL: http://bonus-service:8050
ingress:
  enabled: true
  className: nginx
