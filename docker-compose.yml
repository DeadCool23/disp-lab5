version: "3"
services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: on-failure
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./charts/keycloak/files/lab5-realm.json:/opt/keycloak/data/import/lab5-realm.json:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/lab5 HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  bonus-service:
    build: ./bonus-service
    image: ${DOCKER_USER:-local}/bonus-service:${TAG:-latest}
    container_name: bonus-service
    restart: on-failure
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  flight-service:
    build: ./flight-service
    image: ${DOCKER_USER:-local}/flight-service:${TAG:-latest}
    container_name: flight-service
    restart: on-failure
    ports:
      - "8060:8060"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  ticket-service:
    build: ./ticket-service
    image: ${DOCKER_USER:-local}/ticket-service:${TAG:-latest}
    container_name: ticket-service
    restart: on-failure
    ports:
      - "8070:8070"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  gateway-service:
    build: ./gateway-service
    image: ${DOCKER_USER:-local}/gateway-service:${TAG:-latest}
    container_name: gateway-service
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      flight-service:
        condition: service_started
      ticket-service:
        condition: service_started
      bonus-service:
        condition: service_started
    environment:
      FLIGHT_SERVICE_URL: http://flight-service:8060
      TICKET_SERVICE_URL: http://ticket-service:8070
      BONUS_SERVICE_URL: http://bonus-service:8050

volumes:
  db-data:
