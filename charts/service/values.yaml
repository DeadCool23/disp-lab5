appName: service

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
port: 8080

env: {}

probes:
  path: /manage/health
  initialDelaySeconds: 30

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

service:
  type: ClusterIP

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /
